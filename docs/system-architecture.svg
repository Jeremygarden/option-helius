<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Option Helius System Architecture</title>
  <desc id="desc">Architecture diagram showing Next.js frontend, FastAPI backend, analytics services, market data integrations, Redis, TimescaleDB, and IBKR Gateway deployment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 24px Inter,Arial,sans-serif;fill:#0f172a}.subtitle{font:500 13px Inter,Arial,sans-serif;fill:#64748b}.zone{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5;rx:18}.zoneTitle{font:700 15px Inter,Arial,sans-serif;fill:#334155}.node{stroke-width:1.5;rx:12}.nodeText{font:700 14px Inter,Arial,sans-serif;fill:#0f172a}.small{font:500 12px Inter,Arial,sans-serif;fill:#475569}.edge{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.front{fill:#fff7ed;stroke:#fb923c}.api{fill:#eff6ff;stroke:#60a5fa}.svc{fill:#fefce8;stroke:#eab308}.data{fill:#f0fdf4;stroke:#4ade80}.ext{fill:#faf5ff;stroke:#a78bfa}.infra{fill:#eef2ff;stroke:#818cf8}.legend{font:600 12px Inter,Arial,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="40" y="42" class="title">Option Helius — 美股期权大师 Dashboard 架构</text>
  <text x="40" y="66" class="subtitle">Next.js dashboard → FastAPI API/services → market-data integrations → cache/history stores, with optional IBKR Gateway sidecar</text>
  <rect x="35" y="95" width="250" height="430" class="zone"/><text x="55" y="122" class="zoneTitle">Frontend / UI</text>
  <rect x="65" y="150" width="190" height="76" class="node front"/><text x="160" y="181" text-anchor="middle" class="nodeText">Next.js 14 App</text><text x="160" y="202" text-anchor="middle" class="small">Tailwind dashboard</text>
  <rect x="65" y="255" width="190" height="96" class="node front"/><text x="160" y="284" text-anchor="middle" class="nodeText">Pages</text><text x="160" y="306" text-anchor="middle" class="small">Chain · Sentiment</text><text x="160" y="326" text-anchor="middle" class="small">Macro · Picks · Report</text>
  <rect x="65" y="380" width="190" height="84" class="node front"/><text x="160" y="410" text-anchor="middle" class="nodeText">Components</text><text x="160" y="432" text-anchor="middle" class="small">charts, layout, prefs</text>
  <rect x="330" y="95" width="315" height="430" class="zone"/><text x="350" y="122" class="zoneTitle">Backend / API</text>
  <rect x="370" y="150" width="235" height="74" class="node api"/><text x="488" y="181" text-anchor="middle" class="nodeText">FastAPI App</text><text x="488" y="202" text-anchor="middle" class="small">lifespan, CORS, middleware</text>
  <rect x="365" y="255" width="245" height="92" class="node api"/><text x="488" y="284" text-anchor="middle" class="nodeText">Routers</text><text x="488" y="306" text-anchor="middle" class="small">options, macro, sentiment</text><text x="488" y="326" text-anchor="middle" class="small">scanner, picks, report</text>
  <rect x="365" y="380" width="245" height="92" class="node svc"/><text x="488" y="408" text-anchor="middle" class="nodeText">Domain Services</text><text x="488" y="430" text-anchor="middle" class="small">pricing · scanner · regime</text><text x="488" y="450" text-anchor="middle" class="small">strategy scorer/selector</text>
  <rect x="700" y="95" width="220" height="430" class="zone"/><text x="720" y="122" class="zoneTitle">Data Sources</text>
  <rect x="730" y="150" width="160" height="72" class="node ext"/><text x="810" y="180" text-anchor="middle" class="nodeText">IBKR Client</text><text x="810" y="201" text-anchor="middle" class="small">chains, quotes, greeks</text>
  <rect x="730" y="255" width="160" height="72" class="node ext"/><text x="810" y="285" text-anchor="middle" class="nodeText">Market APIs</text><text x="810" y="306" text-anchor="middle" class="small">AlphaVantage / FlashAlpha</text>
  <rect x="730" y="360" width="160" height="72" class="node ext"/><text x="810" y="390" text-anchor="middle" class="nodeText">Mock Fixtures</text><text x="810" y="411" text-anchor="middle" class="small">local fallback/demo</text>
  <rect x="965" y="95" width="200" height="430" class="zone"/><text x="985" y="122" class="zoneTitle">Storage / Infra</text>
  <rect x="995" y="150" width="140" height="72" class="node data"/><text x="1065" y="180" text-anchor="middle" class="nodeText">Redis</text><text x="1065" y="201" text-anchor="middle" class="small">cache + refresh state</text>
  <rect x="995" y="255" width="140" height="72" class="node data"/><text x="1065" y="285" text-anchor="middle" class="nodeText">TimescaleDB</text><text x="1065" y="306" text-anchor="middle" class="small">history + indicators</text>
  <rect x="995" y="380" width="140" height="84" class="node infra"/><text x="1065" y="410" text-anchor="middle" class="nodeText">Docker Compose</text><text x="1065" y="432" text-anchor="middle" class="small">backend/frontend</text><text x="1065" y="450" text-anchor="middle" class="small">optional IBKR sidecar</text>
  <rect x="395" y="580" width="410" height="105" class="zone"/><text x="415" y="607" class="zoneTitle">Optional IBKR Deployment</text><rect x="430" y="625" width="150" height="42" class="node infra"/><text x="505" y="651" text-anchor="middle" class="nodeText">ibgateway</text><rect x="625" y="625" width="150" height="42" class="node ext"/><text x="700" y="651" text-anchor="middle" class="nodeText">TWS / IBC</text>
  <path class="edge" d="M255 188 H370"/><text x="312" y="178" text-anchor="middle" class="small">REST</text><path class="edge" d="M255 303 H365"/><text x="310" y="293" text-anchor="middle" class="small">API calls</text><path class="edge" d="M488 224 V255"/><path class="edge" d="M488 347 V380"/><path class="edge" d="M610 426 H730"/><text x="670" y="416" text-anchor="middle" class="small">fetch/normalize</text><path class="edge" d="M610 292 H730"/><path class="edge" d="M890 186 H995"/><text x="942" y="176" text-anchor="middle" class="small">cache</text><path class="edge" d="M890 291 H995"/><text x="942" y="281" text-anchor="middle" class="small">persist</text><path class="edge" d="M610 430 C675 540 940 540 1035 464"/><text x="820" y="545" text-anchor="middle" class="small">read/write</text><path class="edge dash" d="M810 222 C805 345 720 540 580 625"/><text x="724" y="540" class="small">IBKR_ENABLED=true</text><path class="edge" d="M580 646 H625"/><path class="edge dash" d="M995 422 C910 545 790 608 775 625"/>
  <rect x="40" y="690" width="1120" height="40" fill="#fff" stroke="#cbd5e1" rx="10"/><text x="60" y="715" class="legend">Legend:</text><circle cx="125" cy="710" r="7" fill="#fff7ed" stroke="#fb923c"/><text x="140" y="715" class="small">UI</text><circle cx="190" cy="710" r="7" fill="#eff6ff" stroke="#60a5fa"/><text x="205" y="715" class="small">API</text><circle cx="265" cy="710" r="7" fill="#fefce8" stroke="#eab308"/><text x="280" y="715" class="small">Services</text><circle cx="370" cy="710" r="7" fill="#faf5ff" stroke="#a78bfa"/><text x="385" y="715" class="small">External/data source</text><circle cx="540" cy="710" r="7" fill="#f0fdf4" stroke="#4ade80"/><text x="555" y="715" class="small">Storage</text><line x1="645" y1="710" x2="690" y2="710" class="edge dash" marker-end="url(#arrow)"/><text x="705" y="715" class="small">optional path</text>
</svg>
